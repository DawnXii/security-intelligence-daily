document.querySelectorAll('#ioc-sec .ichip').forEach(function(b){b.addEventListener('click',function(){
 var k=b.dataset.k;st[k]=b.dataset.v;
 document.querySelectorAll('#ioc-sec .ichip[data-k="'+k+'"]').forEach(function(x){x.classList.toggle('on',x===b);});
 draw();});});
document.getElementById('ioc-q').addEventListener('input',function(e){st.q=e.target.value.trim().toLowerCase();draw();});
document.getElementById('ioc-all').addEventListener('change',function(e){var rs=filt().slice(0,800);
 rs.forEach(function(r){if(e.target.checked)sel[r.i]=1;else delete sel[r.i];});draw();});
function say(t){var m=document.getElementById('ioc-msg');m.textContent=t;setTimeout(function(){m.textContent='';},2500);}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){say('已复制 '+t.split(String.fromCharCode(10)).length+' 行（原始值）');});}
 var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();say('已复制（原始值）');}
document.getElementById('ioc-copy-sel').addEventListener('click',function(){var ks=Object.keys(sel);
 ks.length?copyTxt(ks.join(String.fromCharCode(10))):say('未勾选任何行');});
document.getElementById('ioc-copy-vis').addEventListener('click',function(){copyTxt(filt().map(function(r){return r.i;}).join(String.fromCharCode(10)));});
document.getElementById('ioc-csv').addEventListener('click',function(){var rs=filt();
 var head='indicator,type,family,threat,arch,os,confidence,date,source';
 var body=rs.map(function(r){return '"'+r.i+'","'+r.t+'","'+(r.f||'')+'","'+(r.tt||'')+'","'+(r.arch||[]).join(' ')+'","'+(r.os||'')+'",'+(r.c||0)+',"'+r.d+'","'+r.z+'"';}).join(String.fromCharCode(10));
 var b=new Blob([head+String.fromCharCode(10)+body],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='sid-iocs.csv';a.click();say('已导出 '+rs.length+' 条（原始值）');});
draw();})();
</script>
