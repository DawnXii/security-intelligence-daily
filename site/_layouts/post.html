---
layout: default
---
<main class="post">
<div class="post-hero">
  <div class="wrap">
    <span class="date">Issue · {{ page.date | date: "%Y-%m-%d" }}</span>
    <h1>{% if page.headline %}{{ page.headline }}{% else %}{{ page.title }}{% endif %}</h1>
    {% if page.dek %}<p class="post-dek">{{ page.dek }}</p>{% endif %}
    {% if page.brief_stats %}<div class="post-chips">{% for sb in page.brief_stats %}<span class="pchip">{{ sb }}</span>{% endfor %}</div>{% endif %}
    <hr class="rule">
  </div>
</div>
<div class="content post-wrap">
{{ content }}
</div>
</main>
