# LAB-MARKER — lab origin: NLB sim = geo on CF ranges, non-CF -> 444.
include /etc/nginx/cloudflare-geo.conf;
server {
    listen 80;
    listen [::]:80;
    server_name <ORIGIN-IP>.sslip.io <ATTACKER-TEST-IP>.sslip.io;
    if ($is_cf_egress = 0) { return 444; }
    location /secret-admin {
        default_type text/plain;
        return 200 "SECRET-DB-CONSTR=FAKE-SECRET\ntotal_rows=48213\nvia_waf=NO host=$host src_ip=$remote_addr xff=$http_x_forwarded_for\n";
    }
    location / { default_type text/plain; return 200 "origin ok host=$host src_ip=$remote_addr\n"; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <ORIGIN-IP>.sslip.io <ATTACKER-TEST-IP>.sslip.io;
    if ($is_cf_egress = 0) { return 444; }
    ssl_certificate /etc/nginx/ssl/lab.pem;
    ssl_certificate_key /etc/nginx/ssl/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:!aNULL:!MD5;
    location /secret-admin {
        default_type text/plain;
        return 200 "SECRET-DB-CONSTR=FAKE-SECRET\ntotal_rows=48213\nvia_waf=NO host=$host src_ip=$remote_addr xff=$http_x_forwarded_for\n";
    }
    location / { default_type text/plain; return 200 "origin ok host=$host src_ip=$remote_addr\n"; }
}
